<script>
'use strict';
const KEY='china-climate-classroom-v1.0';
const fresh=()=>({version:1,page:0,season:'winter',visited:{winter:[],summer:[]},answers:{},results:{},revealed:{},farm:0,farmAnswers:{},farmResults:{},belt:0,accum:0});
const validState=x=>x&&x.version===1&&Number.isInteger(x.page)&&x.page>=0&&x.page<12&&['winter','summer'].includes(x.season)&&x.visited&&Array.isArray(x.visited.winter)&&Array.isArray(x.visited.summer)&&x.answers&&x.results&&x.revealed&&x.farmAnswers&&x.farmResults&&Number.isInteger(x.farm)&&x.farm>=0&&x.farm<3&&Number.isInteger(x.belt)&&x.belt>=0&&x.belt<6&&Number.isInteger(x.accum)&&x.accum>=0&&x.accum<=5;
let state=fresh(),storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(validState(parsed))state=parsed}}catch{storageOK=false}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageOK=false} $('saveStatus').textContent=storageOK?'离线课件 · 区域关系示意，不是精确地理地图 · 进度保存在当前浏览器':'离线课件 · 当前浏览器无法保存进度，课堂操作仍可正常使用；关闭页面后需重新开始';}
const pages=[
['出发','考察任务','气温里的种植密码','为不同地区制定种植建议。先调查、再判断，最后用证据解释。','不同地区为什么不能完全采用同一种种植方案？','3分钟 · 情境导入'],
['读图','调查准备','先学会读图','读图例，找范围，理解等温线。这里展示月平均气温，不是今天的天气。','颜色和等温线分别告诉我们什么？','2分钟 · 读图方法'],
['冬季','第一关 / 冬季调查','南北冬季一样冷吗？','点击漠河和海南收集证据，再提交你对冬季分布的判断。','你的结论由哪些证据支持？','5分钟 · 比较归纳'],
['界线','第一关 / 冬季调查','寻找重要的0℃线','查看区域关系图中的界线，再选择它大致对应的地理位置。','月平均气温0℃意味着每天都0℃吗？','3分钟 · 重要界线'],
['成因','第一关 / 冬季调查','冬季差异从哪里来？','把观察到的分布规律与纬度、冬季风联系起来。','北方冬季为什么获得的光热较少？','2分钟 · 因果解释'],
['夏季','第二关 / 夏季调查','切换季节，比较变化','先后查看同一组南北区域的冬夏气温，注意图例和证据。','夏季和冬季的南北差异相同吗？','5分钟 · 冬夏对照'],
['例外','第二关 / 夏季调查','夏季全国都高温吗？','找到青藏高原，结合地形证据修正绝对化判断。','纬度较低，就一定比北方更热吗？','4分钟 · 识别例外'],
['积温','第三关 / 热量调查','热量要看一整段时间','只看7月气温不足以决定全年种植安排，还要认识活动积温。','两个地区夏季都热，熟制就一定相同吗？','3分钟 · 概念过渡'],
['温度带','第三关 / 热量调查','认识五个温度带','点击温度带卡片，自北向南观察热量和农业的变化。高原区单独认识。','中国温度带按什么主要指标划分？','3分钟 · 温度带'],
['农场','第三关 / 农业决策','制定农场种植建议','选择作物、熟制与热量理由。至少完成两个农场，并解释你的方案。','你的方案适合当地热量条件吗？','7分钟 · 决策挑战'],
['迁移','独立评价','带着证据解决新问题','先独立思考，再提交判断。教师操作一次不能代表全班已经掌握。','怎样识别一个缺少证据的农业建议？','5分钟 · 出口评价'],
['归档','考察结束','把发现连成一条线','回看调查证据和农业方案，完成课堂总结。','同属一个温度带，农业一定完全相同吗？','3分钟 · 总结迁移']];
const questions={
read:{opts:['同一颜色代表图例中的同一温度范围；等温线连接平均气温相同的地点','同一颜色代表所有地点今天温度完全相同'],right:0,ok:'读图先看图例；本课用1月、7月平均气温理解冬夏分布。',hint:'请区分“月平均气温”和“今天的天气”。'},
winter:{opts:['冬季南北气温差异大，南方较暖，越往北总体越冷','冬季南北温差小，全国都温暖','冬季越往南气温总体越低'],right:0,needs:()=>['north','south'].every(x=>state.visited.winter.includes(x)),need:'请先在冬季图中点击漠河和海南，收集两处证据。',ok:'漠河与海南的示意范围支持冬季南北气温差异大。这里是平均气温，不是每天的最低温。',hint:'请重新比较漠河、海南的证据卡与冷热图例。'},
line:{opts:['秦岭—淮河一线','长江干流一线','大兴安岭一线'],right:0,ok:'1月0℃等温线大致沿秦岭—淮河一线分布。这里是概括，不能理解为每一段都精确重合。',hint:'请回想南北方之间的重要界线；选对后将显示位置名称。'},
cause:{opts:['纬度造成北方冬季光热较少，且北方受冬季风影响较大','北方冬季白昼比南方更长，所以更冷','全国海拔都相同，只有距海远近决定冬季温度'],right:0,ok:'北方冬季正午太阳高度较小、白昼较短，获得光热较少；冬季风又加剧寒冷。',hint:'同时检查“纬度与光热”和“冬季风”两条证据。'},
summer:{opts:['大部分地区夏季普遍高温，南北温差比冬季小','夏季只有南方高温，北方仍普遍严寒','全国所有地区夏季温度完全一样'],right:0,needs:()=>['north','south'].every(x=>state.visited.summer.includes(x))&&['north','south'].every(x=>state.visited.winter.includes(x)),need:'请分别切换冬季、夏季，点击同一组南北区域，收集对照证据。',ok:'南北多数地区夏季都较热，南北温差较冬季小；“普遍”并不等于没有例外。',hint:'查看北方夏季证据，并注意“所有”“完全一样”等绝对表述。'},
plateau:{opts:['青藏高原海拔高，夏季气温相对较低','青藏高原在南方，所以一定最热','青藏高原没有太阳光照'],right:0,needs:()=>state.visited.summer.includes('plateau'),need:'请先点击青藏高原，查看地形证据。',ok:'海拔高是青藏高原夏季气温相对较低的重要原因；高山地区也可能是低温区。',hint:'请比较高原与平原的海拔，不要只看南北位置。'},
accum:{opts:['相关持续期内日平均气温的累计，主要反映热量条件','只要知道7月气温，就能决定全年熟制','把每天气温减去10℃再相加，就是本课的活动积温'],right:0,ok:'≥10℃活动积温是相关持续期内日平均气温的累计，不是每天减去10℃。本例只演示累加，并非真实全年数据。',hint:'本课讨论“活动积温”，不要与减去基温后的其他指标混淆。'},
belts:{opts:['以≥10℃活动积温为主要指标，并结合农业生产实际','按地球五带的太阳直射和极昼极夜现象划分','只按1月平均气温划分，完全不考虑农业'],right:0,ok:'中国温度带与地球五带不是同一套划分。我国有五个温度带，另有青藏高原气候区。',hint:'回到“全年热量累计”这一证据，而非仅看某月温度。'},
exit1:{opts:['不一定，还要看全年热量条件和适宜生长时段','一定，7月热就能全年连续种植'],right:0,ok:'夏季高温不等于全年热量充足。熟制需要结合积温、生长期及其他生产条件。',hint:'想一想冬季低温会怎样影响生长时段。'},
exit2:{opts:['青藏高原海拔高，气温相对较低','越往南所有地方都一定更热'],right:0,ok:'地形会影响气温，不能把纬度规律绝对化。',hint:'请用高程证据解释。'},
exit3:{opts:['热量条件影响典型作物与熟制，但水分、品种等也会影响实际生产','同一温度带的所有农场只能种同一种作物','热带果树一年收果多次就等于粮食轮作一年多熟'],right:0,ok:'温度带体现热量差异，农业仍受多种条件影响；果树收果次数不能直接当作轮作熟制。',hint:'请检查“只有一种作物”的说法和多年生果树与粮食熟制的区别。'}};

case 7:{const days=[12,15,18,20,22],sum=days.slice(0,state.accum).reduce((a,b)=>a+b,0);return `<div class="tile"><span class="tag">教学示例 · 不是实测全年数据</span><h3>连续五个符合条件的示例日</h3><p>本例每日日平均气温都≥10℃，演示相关持续期内的累计。</p><div class="dayrow">${days.map((d,i)=>`<div class="day ${i<state.accum?'on':''}"><span class="small">第${i+1}日</span><b>${d}℃</b></div>`).join('')}</div><div class="row"><span class="sum">${sum}</span><span>℃·日<br><span class="small">表示温度随日数累计，并非当天气温</span></span></div><div class="row" style="margin-top:15px"><button data-act="accum" ${state.accum===5?'disabled':''}>累计下一日</button><button data-act="accumreset">重看累加</button></div></div><div class="notice">真实全年活动积温需要确定相应持续期。本例不是把零散暖日拼成全年热量，也不是每天减去10℃。</div>${quiz('accum')}`;}

function reveal(){const qs=pageQs[state.page]||[];qs.forEach(q=>{state.revealed[q]=true});$('modal').close();render();if(!qs.length)openModal('本屏讲解提示',state.page===9?`<p>${farms.map(f=>`${f.name}：${f.why}`).join('</p><p>')}</p><p>这些是教师讲解，不计为农场自主完成。</p>`:'<p>本屏可以结合任务区与资料卡直接讲解；需要评价的任务请让学生自主提交。</p>');}
function resetPage(){const qs=pageQs[state.page]||[];qs.forEach(q=>{delete state.answers[q];delete state.results[q];delete state.revealed[q]});if(state.page===9){state.farmAnswers={};state.farmResults={}}if(state.page===7)state.accum=0;$('modal').close();render();say('本屏任务已重置，已收集证据保留。');}
function sources(){openModal('内容与来源说明','<p>依据用户提供的《中国的气候-第一课时.html》教学资料整理。尚未核验教材原页、精确气象数据与标准地图。</p><p>本课件采用区域关系示意图，不是中国行政区划图、真实等温线地图或GIS数据，不用于边界、距离和精确位置判断。台湾等未单列的区域不意味着不属于全国分布讨论范围。</p><p>保留冬夏气温规律、积温、温度带与典型农业示例；未采用附件中前后不一致的漠河图示数值和缺少来源的极端纪录。未提供真实产量与生长天数预测。</p><p>后续如提供教材原图，可替换为来源明确的专题图，并沿用本课交互规则。</p>');}
function printSheet(){ $('printSheet').innerHTML='<h1>中国农业考察队 · 学习任务单</h1><p>班级：________　姓名/小组：________　日期：________</p><section><h2>一、冬季调查</h2><p>北方证据：________________　南方证据：________________</p><p>我国冬季气温特点：________________________________</p><p>1月0℃等温线大致沿：________________________________</p></section><section><h2>二、夏季调查</h2><p>夏季气温特点：________________________________</p><p>低温例外及其原因：________________________________</p></section><section><h2>三、农业决策</h2><p>选择地区与温度带：________________________________</p><p>典型作物与熟制：________________________________</p><p>热量依据及其他适用条件：________________________________</p></section><section><h2>四、独立迁移</h2><p>“7月气温高就一定能一年三熟。”你同意吗？还需要什么证据？</p><p>________________________________________________</p><p>同一温度带的农业一定相同吗？为什么？</p><p>________________________________________________</p></section>';window.print();}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const act=b.dataset.act,i=Number(b.dataset.i),q=b.dataset.q;if(act==='go'||act==='jump'){if($('modal').open)$('modal').close();go(i)}else if(act==='answer'){state.answers[q]=i;delete state.results[q];delete state.revealed[q];render()}else if(act==='submit'){const x=questions[q],a=state.answers[q];let ok=false,msg;if(a===undefined)msg='请先选择一个判断，再提交。';else if(x.needs&&!x.needs())msg=x.need;else{ok=a===x.right;msg=ok?x.ok:x.hint}state.results[q]={ok,msg};delete state.revealed[q];render();say(msg)}else if(act==='visit'){const season=b.dataset.season,r=b.dataset.region;if(!state.visited[season].includes(r))state.visited[season].push(r);render();say('证据已加入右侧证据袋。')}else if(act==='line'){openModal('认识冬季参考界线','<p>这条虚线表示1月0℃等温线的大致位置关系，不是精确曲线。请在“界线”工作站判断它对应的地理位置。</p><p>月平均气温0℃，并不表示每一天都恰好0℃。夏季保留此线仅用于位置对照。</p>')}else if(act==='season'){state.season=b.dataset.value;render()}else if(act==='belt'){state.belt=i;render()}else if(act==='farm'){state.farm=i;render()}else if(act==='farmSubmit'){const f=farms[state.farm],a=state.farmAnswers[state.farm]||{};let ok=false,msg;if(['crop','cycle','reason'].some(k=>a[k]===undefined))msg='请完成作物、熟制和热量依据三项选择。';else if(a.crop!==f.crop)msg='这套作物方案与本农场提供的典型案例不匹配；这不表示当地绝不能种植其他作物。';else if(!f.allowed.includes(a.cycle))msg='请重新检查本案例的热量条件与典型熟制，不能只看夏季高温。';else if(a.reason!==f.reason)msg='作物和熟制已有依据，请再检查热量理由是否对应本区域。';else{ok=true;msg=f.why}state.farmResults[state.farm]={ok,msg};render();say(msg)}else if(act==='accum'){state.accum=Math.min(5,state.accum+1);render()}else if(act==='accumreset'){state.accum=0;render()}else if(act==='reveal')reveal();else if(act==='resetPage')resetPage();else if(act==='new')resetAll();else if(act==='confirmReset'){state=fresh();$('modal').close();render();say('新课堂已开始。')}else if(act==='close')$('modal').close();else if(act==='print')printSheet();else if(act==='sources')sources();});
document.addEventListener('change',e=>{if(e.target.dataset.act!=='farmselect')return;const field=e.target.dataset.field;if(!state.farmAnswers[state.farm])state.farmAnswers[state.farm]={};if(e.target.value==='')delete state.farmAnswers[state.farm][field];else state.farmAnswers[state.farm][field]=Number(e.target.value);delete state.farmResults[state.farm];render();$(field).focus();});
$('prev').onclick=()=>go(state.page-1);$('next').onclick=()=>go(state.page+1);$('teacher').onclick=teacher;$('closeModal').onclick=()=>$('modal').close();$('help').onclick=()=>openModal('课前与课堂使用','<p>用最新版Edge或Chrome打开本文件即可，全部必做环节可离线使用。建议课前检查投屏字号和触屏操作。</p><ol><li>点击“开始新课堂”清除上次进度。</li><li>先让学生讨论，再点击区域收集证据、选择判断并提交。</li><li>农场三项选择完成后提交，至少完成两个农场。</li><li>教师控制可跳转、公布结论或重做，不强制通关。</li><li>同浏览器刷新可恢复进度；更换电脑或浏览器不会同步。</li></ol><p>所有互动均可点击完成，无需拖拽。教师公布不计为自主完成。使用打印任务单记录个人学习证据。</p><button data-act="sources">查看来源与示意图说明</button>');$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{openModal('全屏提示','<p>浏览器未允许网页全屏。可使用浏览器菜单进入全屏，Windows通常可按F11。</p>')}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏'});
render();
</script></body></html>
