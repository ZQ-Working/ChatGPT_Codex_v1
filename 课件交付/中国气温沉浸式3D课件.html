function focusLocation(id,{manual=true}={}){const l=locations[id];if(!l)return;if(manual)stopTour(false);orbit=false;$('orbit').classList.remove('active');active=id;if(id.startsWith('band')){const b=bandInfo[Number(id.slice(4))];goal={yaw:.4,pitch:.72,distance:145,target:[l.x,height(l.x,l.z)+2,l.z]};renderUI();caption('温度带 / 热量条件示意',b[0]+' · '+b[1],'代表作物：'+b[2]+'。这些是典型示例；图层不是精确分界地图。');return}if(state.mode==='farm'){if(!farms[id])return;if(state.farmId!==id){run=null;state.farmId=id}goal={yaw:.45,pitch:.58,distance:innerWidth<720?80:69,target:[l.x-3,height(l.x,l.z),l.z]};renderUI();caption(l.zone,'在这里，让作物生长',l.reason);return}
if(manual&&!state.seen[state.mode].includes(id))state.seen[state.mode].push(id);let target=[l.x,height(l.x,l.z)+2,l.z];goal={yaw:id==='plateau'?.75:.25,pitch:id==='plateau'?.49:.72,distance:id==='plateau'?115:105,target};renderUI();if(state.mode==='winter'){if(id==='mohe')caption('北方 / 1月平均气温','漠河附近：冬季寒冷','附件正文给出低于−24℃的范围。北方冬季光热较少，受冬季风影响也较大。');if(id==='hainan')caption('南方 / 1月平均气温','海南：冬季较温暖','附件给出16℃以上的范围。和漠河比较，可见冬季南北气温差异大。');if(id==='plateau')caption('高海拔地区','地形也在影响气温','高原不是单一气候环境；此处山体经过夸张，便于观察高差。')}else{if(id==='mohe')caption('北方 / 7月平均气温','北方夏季也较热','我国北方大部分地区夏季也较热，南北温差比冬季小；不是每一个地点都超过同一个温度。');if(id==='hainan')caption('南方 / 7月平均气温','夏季，大部分地区普遍高温','南北温差比冬季小。“普遍”不意味着所有地方温度相同。');if(id==='plateau')caption('夏季低温例外','青藏高原：越过山脊，看见海拔','海拔高，气温相对较低。高山地区也可能较凉，不能只用南北位置解释气温。')}}
function renderFarm(){const f=farms[state.farmId],cfg=farmConfig();$('farmPanel').innerHTML=`<div class="micro">FIELD LAB / 农场实验</div><h2>${f.name}</h2><p>${f.zone} · ${f.heat}<br>水分、土壤等条件假定适宜。</p><div class="section">01 · 作物模型</div><div class="choices">${f.crops.map(c=>`<button data-crop="${c}" class="${cfg.crop===c?'active':''}" aria-pressed="${cfg.crop===c}">${cropNames[c]}</button>`).join('')}</div><div class="section">02 · 种植安排</div><div class="choices">${cycleNames.map((c,i)=>`<button data-cycle="${i}" class="${cfg.cycle===i?'active':''}" aria-pressed="${cfg.cycle===i}">${c}</button>`).join('')}</div><div class="growthbar"><i id="growthProgress"></i></div><div class="tiny" id="growthStatus">${cfg.cycle===1?'跨两个年度的三季示意':'一年内种植季示意'} · 非真实时间</div><button id="grow" class="runbtn">${run&&!run.done?'重新播种':'播种，观察生长 →'}</button><div class="farm-controls"><button id="pauseGrowth">${run?.paused?'继续动画':'暂停动画'}</button><button id="finishGrowth">快进到结果</button></div><div id="farmResult" class="result ${cfg.success?'ok':''}" ${cfg.done?'':'hidden'}>${cfg.done?(cfg.success?(cfg.typical?'✓ 热量支持本例的典型安排。':'✓ 可以完成；还可尝试更充分利用热量的典型安排。')+f.reason:'↗ 本例的热量条件不足以支持这套熟制，请减少或调整种植季，再观察。'):''}</div><p style="font-size:10px;margin-bottom:0">作物与熟制是典型案例，不是唯一农业方案。模型代表作物外观，连续生长不表示同一作物的真实轮作。动画不预测产量或播收日期。</p>`;updateRunUI();}
function startRun(){stopTour(false);const cfg=farmConfig(),f=farms[state.farmId];cfg.done=false;cfg.success=false;cfg.typical=false;run={elapsed:0,duration:12,paused:false,done:false,valid:[1,1.5,2,3][cfg.cycle]<=Math.max(...f.allowed.map(i=>[1,1.5,2,3][i])),typical:f.allowed.includes(cfg.cycle)};renderFarm();renderEvidence();save();caption('作物生长 / 时间压缩示意',cfg.cycle===1?'跨两个年度，观察三季生长':'看着幼苗长高，再观察最后一季','可以暂停或快进。熟制与作物生长都是定性示意，不是真实生产预测。')}
function updateRunUI(){if(!run||!$('growthProgress'))return;let t=clamp(run.elapsed/run.duration,0,1),cfg=farmConfig(),cycles=cfg.cycle===0?1:cfg.cycle===2?2:3,current=Math.min(cycles,Math.floor(t*cycles)+1);$('growthProgress').style.width=t*100+'%';$('growthStatus').textContent=run.done?'观察完成':`${cfg.cycle===1?'两年度示意 · ':''}第${current}/${cycles}季 · ${run.paused?'已暂停':'正在生长'}`;}
function finishRun(){if(!run||run.done)return;run.elapsed=run.duration;run.done=true;run.paused=false;const cfg=farmConfig(),f=farms[state.farmId];cfg.done=true;cfg.success=run.valid;cfg.typical=run.typical;renderFarm();renderEvidence();save();if(run.valid){caption('生长观察完成',run.typical?'你的典型安排获得热量证据支持':'可以成熟，还能探索更充分的安排',f.reason);toast('本农场建议已记录。试试其他熟制，再比较结果。')}else{caption('生长观察完成','最后一季未能完成成熟','本例热量条件不足。请调整熟制再试；不要只根据夏季高温决定全年安排。');toast('请调整种植安排，重新观察。')}}
const tourShots=[['winter',null,5],['winter','mohe',7],['winter','hainan',7],['winter',null,5],['summer',null,6],['summer','plateau',8],['farm','northeast',7],['farm','northplain',7],['farm','southplain',7]];
function advanceTour(){if(!demo)return;const i=demo.index+1;if(i>=tourShots.length){stopTour(false);toast('巡游结束。现在轮到你点击、比较和种植。');return}demo.index=i;demo.elapsed=0;const [mode,id,wait]=tourShots[i];demo.wait=wait;changeMode(mode,{tour:true});if(id)focusLocation(id,{manual:false});if(i===3){lineVisible=true;renderUI();caption('冬季重要界线','秦岭—淮河，与1月0℃线','等温线大致在此附近；不是每天0℃，也不是完全重合的精确地理线。')}}
function discoveries(){let winter=['mohe','hainan'].every(id=>state.seen.winter.includes(id)),summer=state.seen.summer.includes('plateau'),count=Object.values(state.farms).filter(f=>f?.success).length;dialog('旅程中的发现',`<div class="cards"><div class="card">${winter?'✓':'○'} 冬季：南北温差大，南方较暖，越往北总体越冷。<br><span class="tiny">已探索${state.seen.winter.filter(x=>['mohe','hainan'].includes(x)).length}/2个南北地标。</span></div><div class="card">${summer?'✓':'○'} 夏季：大部普遍高温，南北温差较冬季小；高原等高海拔地区较凉。</div><div class="card">${count>=2?'✓':'○'} 农业：热量影响作物生长时段和熟制；已完成${count}/3个农场建议。</div></div><p>发现记录只表示本机交互，不代表全班掌握。自动巡游不记录自主探索或农业建议。</p><button id="resetDiscoveries">开始新旅程</button>`)}
function explain(){dialog('讲解，只在需要时出现',`<div class="cards"><div class="card"><b>冬季为何南北差异大？</b><br>北方冬季太阳高度较小、白昼较短，获得光热较少；冬季风又加剧寒冷。</div><div class="card"><b>夏季为何大部高温？</b><br>夏季北方白昼较长，南北光热差异减小；海拔高的地区仍较凉。</div><div class="card"><b>温度带与农业</b><br>以≥10℃活动积温为主要指标，结合农业生产实际划分。活动积温是相关持续期内日平均气温累计，不是每天减去10℃。不能只看7月温度安排全年种植。</div><div class="card"><b>五个温度带＋高原气候区</b><br>北→南：寒温带、中温带、暖温带、亚热带、热带；青藏高原气候区单列。寒温带典型一年一熟；中温带一年一熟；暖温带两年三熟或一年两熟；亚热带一年两熟到三熟；热带典型一年三熟。高原适宜河谷等部分地区一年一熟，青稞等耐寒作物是代表。</div></div><p>这些是典型概括，农业还受水分、土壤、品种等影响。热带果树收果次数不能直接等同于粮食轮作熟制。</p><button id="viewSources">模型与资料说明</button>`)}
function sources(){dialog('模型与资料说明','<p>内容依据用户提供的《中国的气候-第一课时.html》教学整理资料。未外部核验教材原页或精确气象数据。</p><p>这是一座程序生成的三维地理情境沙盘，不是真实DEM、中国边界图或精确等温线地图。地形高差经过夸张；地标仅表达区域关系，装饰河道不对应真实河流。全国气温概括包括未单独建模的区域。</p><p>雪景、植被和颜色帮助观察冷热差异，不等同于真实降雪或植被分布；它们也不是可读取气温的数值图例。漠河冬季与海南冬季范围来自附件正文，舍弃了附件中前后不一致的标注与未核实极端纪录。</p><p>农场采用定性热量规则，生长动画压缩时间，不预测真实产量。中温带只在本例采用一年一熟，不意味着现实不存在特殊安排。通过“快进到结果”可以在课堂中缩短等待。</p>')}
function setup(){
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();engine.available=false;fail('浏览器的图形上下文已中断。请重新加载，或关闭其他占用图形资源的页面。')});
window.addEventListener('resize',resize);let drag=null;
canvas.addEventListener('pointerdown',e=>{if(!started||$('modal').open)return;stopTour(false);orbit=false;$('orbit').classList.remove('active');drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
canvas.addEventListener('pointermove',e=>{if(!drag)return;goal.yaw-=(e.clientX-drag.x)*.007;goal.pitch=clamp(goal.pitch+(e.clientY-drag.y)*.005,.20,1.45);drag={x:e.clientX,y:e.clientY}});
function endDrag(){drag=null;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{if(!started||$('modal').open)return;e.preventDefault();stopTour(false);goal.distance=clamp(goal.distance*Math.exp(e.deltaY*.001),38,380)},{passive:false});
$('start').onclick=()=>{state=fresh();save();begin()};$('resume').onclick=begin;
function begin(){started=true;$('intro').hidden=true;changeMode(state.mode);if(!storageOK)toast('本浏览器无法保存进度，但三维交互仍可正常使用。')}
$('overview').onclick=()=>{stopTour(false);overview()};$('orbit').onclick=()=>{stopTour(false);orbit=!orbit;$('orbit').classList.toggle('active',orbit)};
$('zoomIn').onclick=()=>{stopTour(false);goal.distance=clamp(goal.distance*.84,38,380)};$('zoomOut').onclick=()=>{stopTour(false);goal.distance=clamp(goal.distance*1.19,38,380)};
$('flat').onclick=()=>{stopTour(false);goal.pitch=goal.pitch>1.2?.66:1.43;$('flat').textContent=goal.pitch>1.2?'倾斜':'俯视'};
$('lineToggle').onclick=()=>{lineVisible=!lineVisible;renderUI();if(lineVisible)caption('冬季参考界线','1月0℃线，大致沿秦岭—淮河','金色线仅示意位置关系，夏季保留它只是方便对照，不是7月的0℃线。')};
$('zones').onclick=()=>{stopTour(false);if(state.mode!=='farm')changeMode('farm');run=null;beltsVisible=!beltsVisible;active='';if(beltsVisible){goal={yaw:.45,pitch:1.08,distance:innerWidth<720?290:230,target:[0,3,0]};renderUI();caption('五个温度带＋高原气候区','热量不同，大地有不同的生长节奏','点击带名查看典型作物与熟制。以≥10℃活动积温为主要指标，不能只看某月气温。')}else{focusLocation(state.farmId,{manual:false})}};
$('discover').onclick=discoveries;$('notes').onclick=explain;$('close').onclick=()=>$('modal').close();
$('demo').onclick=()=>{if(!started)return;if(demo){stopTour();return}run=null;orbit=false;demo={index:-1,elapsed:0,wait:0};$('demo').textContent='■ 停止巡游';advanceTour();toast('镜头自动巡游；点击地标或拖动即可接管。不记录为自主完成。')};
$('help').onclick=()=>dialog('像探索一个世界一样使用', '<p>鼠标拖动旋转地形，滚轮缩放，点击发光地标聚焦。也可使用全景、环绕、俯视与＋/－按钮；无需拖拽才能完成任务。</p><p>底部三幕随时切换。冬季点击漠河、海南；夏季观察青藏高原；农场选择熟制，点击播种后观察生长。可暂停或快进到结果。</p><p>“电影式巡游”适合开场展示，点击或拖动即可停止并自由探索。讲解信息默认收起。进度保存在本机浏览器，换设备不自动同步。</p><p>电脑投屏推荐全屏使用。浏览器需要支持WebGL；无需联网、安装或服务器。手机可操作，但公开课建议电脑横屏。</p><button id="viewSources">模型与资料说明</button>');
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('网页全屏未获允许，请使用浏览器菜单或F11。')}};
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全屏':'全屏'});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode)changeMode(b.dataset.mode);if(b.dataset.loc)focusLocation(b.dataset.loc);if(b.dataset.crop||b.dataset.cycle!==undefined){run=null;const cfg=farmConfig();if(b.dataset.crop)cfg.crop=b.dataset.crop;else cfg.cycle=Number(b.dataset.cycle);cfg.done=false;cfg.success=false;cfg.typical=false;renderFarm();renderEvidence();save()}if(b.id==='grow')startRun();if(b.id==='pauseGrowth'){if(run&&!run.done){run.paused=!run.paused;renderFarm()}else toast('请先播种开始动画。')}if(b.id==='finishGrowth'){if(run&&!run.done)finishRun();else toast('请先播种开始动画。')}if(b.id==='viewSources')sources();if(b.id==='resetDiscoveries')dialog('开始新旅程？','<p>清除本机记录的发现与农业方案，不删除课件。</p><button id="confirmReset">确认清除并重新出发</button>');if(b.id==='confirmReset'){state=fresh();run=null;stopTour(false);lineVisible=false;beltsVisible=false;$('modal').close();changeMode('winter');toast('新旅程已开始。')}});
document.addEventListener('keydown',e=>{if(!started||$('modal').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(['1','2','3'].includes(e.key))changeMode(['winter','summer','farm'][Number(e.key)-1]);if(e.key==='ArrowLeft'){e.preventDefault();goal.yaw+=.12}if(e.key==='ArrowRight'){e.preventDefault();goal.yaw-=.12}if(e.key==='ArrowUp'){e.preventDefault();goal.pitch=clamp(goal.pitch+.08,.2,1.45)}if(e.key==='ArrowDown'){e.preventDefault();goal.pitch=clamp(goal.pitch-.08,.2,1.45)}});
}
if(!gl){fail('当前浏览器未提供WebGL。请使用最新版Edge或Chrome，检查浏览器的图形加速设置。此课件使用真实三维渲染，不依赖联网。')}else{try{initialize()}catch(e){console.error(e);fail('三维初始化失败。请刷新页面或换用最新版Edge / Chrome。')}}
</script></body></html>
